<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada | Exponenciales Firm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Geist",system-ui,sans-serif;background:#0B0A10;color:#F2F0EB;min-height:100vh;display:flex;align-items:center;-webkit-font-smoothing:antialiased}
  main{max-width:1200px;margin:0 auto;padding:48px;width:100%}
  p.mono{font:500 12px/1 "Geist Mono",monospace;letter-spacing:1.2px;text-transform:uppercase;color:#F43A59;margin-bottom:28px}
  h1{font-weight:700;font-size:72px;line-height:.95;letter-spacing:-3.5px;max-width:800px}
  h1 span{color:#77737F}
  p.lede{font-size:19px;color:#A9A5B3;margin:28px 0 36px;max-width:520px;line-height:1.5}
  a{display:inline-flex;font:600 15px/1 "Geist",sans-serif;padding:14px 20px;border-radius:8px;background:#F43A59;color:#0B0A10;text-decoration:none}
  a:focus-visible{outline:2px solid #F2F0EB;outline-offset:3px}
  @media (max-width:860px){main{padding:24px}h1{font-size:44px;letter-spacing:-1.8px}}
</style>
</head>
<body>
<main>
  <p class="mono">Error 404</p>
  <h1>Esta página <span>ya no existe.</span></h1>
  <p class="lede">La web es nueva y algunas direcciones antiguas cambiaron. Lo que buscas está, casi seguro, en el inicio.</p>
  <a href="/">Ir al inicio →</a>
</main>
</body>
</html>
