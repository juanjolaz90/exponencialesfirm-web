# Sitio estático: no hay paso de compilación, se publica la raíz del repositorio.
# La web se publica en Cloudflare Pages; Netlify queda solo para redirigir el .es mientras tenga ese dominio.
[build]
  publish = "."

# Dominio oficial: exponencialesfirm.com. El .es y las variantes con www llevan a él.
[[redirects]]
  from = "https://www.exponencialesfirm.com/*"
  to = "https://exponencialesfirm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://exponencialesfirm.es/*"
  to = "https://exponencialesfirm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.exponencialesfirm.es/*"
  to = "https://exponencialesfirm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://exponencialesfirm.es/*"
  to = "https://exponencialesfirm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.exponencialesfirm.es/*"
  to = "https://exponencialesfirm.com/:splat"
  status = 301
  force = true

# Archivos del repositorio que no son parte de la web
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
